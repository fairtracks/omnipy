repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        types: [ yaml ]
      - id: check-toml
        types: [ toml ]
      - id: check-merge-conflict
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        args: [-D, mypy]
        name: Validate pyproject.toml
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: local
    hooks:
      - id: install-local-package
        name: Install Local Package
        entry: uv pip install -e . --offline
        language: system
        pass_filenames: false
        types: [python]
      - id: expand-docstr-macros
        name: Expand docstring macros
        description: "Expand docstring macros in Python files."
        args: [ '--verbose', 'v' ]
        language: system
        types: [python]
        stages: [pre-commit]
        entry: python .pre-commit-hooks/expand_docstr_macros.py
      - id: ruff-check
        name: ruff check
        description: "Lint, sort imports and apply safe fixes."
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [ python, jupyter ]
        stages: [ pre-commit ]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [ python, jupyter, markdown ]
        stages: [ pre-commit ]
      - id: ruff-check
        name: ruff check (no fix)
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [ python, jupyter ]
        stages: [ manual ]
      - id: ruff-format
        name: ruff format (no changes)
        entry: uv run ruff format --force-exclude --diff
        language: system
        types_or: [ python, jupyter, markdown ]
        stages: [ manual ]
