on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  autoupdate-prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run prek update
        run: uv run prek update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.CPR_GITHUB_TOKEN }}
          branch: update/prek-autoupdate
          title: Auto-update prek hooks
          commit-message: Auto-update prek hooks
          body: |
            Update versions of tools in the prek
            config to latest version
          labels: dependencies
