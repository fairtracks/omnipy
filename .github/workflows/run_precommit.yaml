name: Python package

on: [push, pull_request]

jobs:
  run-precommit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # The hooks do not depend on the Python version: ruff checks syntax against target-version
      # (pyproject.toml), and the test workflow covers all supported versions.
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run prek hooks
        run: |
          uv run prek run --all-files
