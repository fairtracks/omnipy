name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is derived from the release tags
          fetch-depth: 0
      # The hooks do not depend on the Python version: ruff checks syntax against target-version
      # (pyproject.toml), and the test job covers all supported versions
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --all-groups
      - run: uv run prek run --all-files

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --all-groups
      - run: uv run mkdocs build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - name: Install locale - de_DE.UTF-8
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo update-locale LANG=de_DE.UTF-8
      - run: uv run pytest -v --mypy-pyproject-toml-file=pyproject.toml
