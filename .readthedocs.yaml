# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  apt_packages:
    - language-pack-en
  jobs:
    post_checkout:
      # The package version is derived from the release tags, which a shallow clone lacks
      - git fetch --unshallow --tags || true
    install:
      # Keep Read the Docs' inactivity watchdog informed while uv resolves dependencies.
      - |
        uv sync --group docs &
        uv_sync_pid=$!
        while kill -0 "$uv_sync_pid" 2>/dev/null; do
          echo 'Waiting for uv sync to finish...'
          sleep 20
        done
        wait "$uv_sync_pid"

python:
  install:
    # Read the Docs provides uv and creates its environment before running this command.
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
