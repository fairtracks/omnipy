# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  apt_packages:
    - language-pack-en
  jobs:
    post_checkout:
      # The package version is derived from the release tags, which a shallow clone lacks
      - git fetch --unshallow --tags || true

python:
  install:
    # Runs `uv sync --group docs` into the Read the Docs environment (uv.lock is not committed,
    # so dependencies are resolved fresh on each build)
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
